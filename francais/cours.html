<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cours de français · EduCentre</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Lexend:wght@400;500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Mise en page : une colonne de lecture ; les textes sont posés sur une « page » crème, l'interface reste sur un fond ardoise calme.
   4 étapes dans l'ordre (lire, comprendre, corriger, écrire) ; chaque erreur s'explique dans une bulle colorée selon sa sorte. */
:root{
  --fond:#1e2b38; --carte:#253545; --carte2:#2b3d4f; --ligne:#3f5568; --texte:#eef3f6; --doux:#bccbd6;
  --page:#253545; --encre:#eef3f6; --page-ligne:#e8c774;
  --or:#e8c774; --sauge:#7fb59e; --sauge-f:#3f7a64; --corail:#e58f7b; --lavande:#b3a5d8; --bleu:#8fb3d6;
  --surligne:#ffe08a;
  --titre:"Baloo 2","Atkinson Hyperlegible",Arial,sans-serif; --lecture:"Lexend","Atkinson Hyperlegible",Arial,sans-serif; --ui:"Atkinson Hyperlegible",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--texte);font-family:var(--ui);font-size:18px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--titre);font-weight:800;margin:0;text-wrap:balance}
h1{font-size:36px;display:inline-block;background:var(--sauge-f);border:2px solid var(--sauge);color:#fff;border-radius:14px;padding:2px 18px;box-shadow:0 3px 8px rgba(0,0,0,.35)}
h2{font-size:26px}
.intro{margin:2px 0 0;color:var(--doux)}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--or);outline-offset:2px}
/* Thèmes */
.themes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.themes .theme{flex-direction:column;text-align:center;justify-content:center;gap:2px;padding:8px 6px;min-height:76px}
.themes .theme b{font-size:15px}
.textes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.texte-btn{display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:58px;border-radius:14px;border:2px solid var(--ligne);background:var(--carte);color:var(--texte);text-align:left;box-shadow:0 2px 0 #142029}
.texte-btn .niv{flex:none;color:var(--or);font-size:15px;letter-spacing:1px}
.texte-btn .tt{min-width:0}
.texte-btn b{display:block;font-size:16px;line-height:1.2}
.texte-btn small{color:var(--doux);font-size:13px}
.texte-btn[aria-pressed="true"]{background:var(--sauge-p,#284a40);border-color:var(--sauge)}
.theme{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;border:2px solid var(--ligne);background:var(--carte);color:var(--texte);text-align:left;min-height:64px}
.theme .ico{font-size:28px}
.theme b{display:block;font-size:17px}
.theme small{color:var(--doux);font-size:13px}
.theme{box-shadow:0 2px 0 #142029}
.theme[aria-pressed="true"]{outline:3px solid var(--or);outline-offset:2px;background:var(--carte2)}
/* Étapes */
.etapes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:6px;border-radius:16px;background:var(--carte);border:2px solid var(--ligne)}
.etape{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 6px;border-radius:12px;border:0;background:transparent;color:var(--doux);font-weight:700;font-size:16px}
.etape .num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid currentColor;font-size:14px;flex:none}
.etape[aria-current="step"]{background:var(--sauge-f);color:#fff}
.etape.fait .num{background:var(--sauge);border-color:var(--sauge);color:#13261f}
/* Panneaux */
.panneau{display:flex;flex-direction:column;gap:16px}
.barre{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{box-shadow:0 2px 0 #142029;display:inline-flex;align-items:center;gap:8px;padding:10px 18px;min-height:48px;border-radius:12px;border:2px solid var(--ligne);background:var(--carte2);color:var(--texte);font-weight:700;font-size:17px}
.btn:hover{border-color:var(--or)}
.btn.vert{background:var(--sauge-f);border-color:var(--sauge);color:#fff;box-shadow:0 3px 0 #23463a}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.petit{min-height:40px;padding:6px 12px;font-size:15px}
.consigne{margin:0;color:var(--doux)}
/* La page de lecture */
.page{background:var(--page);color:var(--encre);border:2px solid var(--ligne);border-radius:6px 18px 18px 6px;padding:26px 30px;box-shadow:0 8px 24px rgba(0,0,0,.35);border-left:8px solid var(--page-ligne)}
.page h3{font-size:26px;margin-bottom:10px;color:var(--or)}
.lecture{font-family:var(--lecture);font-size:22px;line-height:1.85;letter-spacing:.01em;max-width:62ch;margin:0}
.lecture .m{border-radius:4px;transition:background .15s}
.lecture .m.lu{background:var(--surligne);color:#1e2b38}
.lecture .indice{background:#fff1b8;color:#1e2b38;box-shadow:0 0 0 3px #fff1b8;border-radius:4px}
.vitesse{display:inline-flex;border:2px solid var(--ligne);border-radius:12px;overflow:hidden}
.vitesse button{border:0;background:var(--carte2);color:var(--doux);padding:8px 14px;font-weight:700}
.vitesse button[aria-pressed="true"]{background:var(--sauge-f);color:#fff}
/* Questions */
body.large .wrap{max-width:1240px}
.deux-col{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.col-q{display:flex;flex-direction:column;gap:16px;min-width:0}
.texte-fixe{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));max-height:calc(100vh - 24px);overflow:auto}
.texte-fixe .lecture{font-size:20px}
@media (max-width:860px){.deux-col{grid-template-columns:1fr}.texte-fixe{top:env(safe-area-inset-top,0px);max-height:38vh;z-index:2;padding:14px 16px}.texte-fixe h3{font-size:20px;margin-bottom:4px}.texte-fixe .lecture{font-size:18px;line-height:1.7}}
.question{background:var(--carte);border:2px solid var(--ligne);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.question.juste{border-color:var(--sauge)}
.q-tete{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.q-tete p{margin:0;font-family:var(--lecture);font-size:20px;font-weight:500}
.lire{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--ligne);background:var(--carte2);color:var(--texte);font-size:20px;display:grid;place-items:center}
textarea::placeholder,input::placeholder{color:#8ea2b1}
textarea{width:100%;min-height:84px;resize:vertical;padding:12px 14px;border-radius:12px;border:2px solid var(--ligne);background:var(--page);color:var(--encre);font-family:var(--lecture);font-size:19px;line-height:1.6}
.rep-juste{margin:0;color:var(--sauge);font-weight:700}
/* Bulles d'erreur : une couleur par famille d'erreur */
.bulles{display:flex;flex-direction:column;gap:8px}
.bulle{position:relative;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;padding:10px 14px;border-radius:14px;background:var(--carte2);border:2px solid var(--c,var(--corail));margin-top:8px}
.bulle::before{content:"";position:absolute;top:-9px;left:26px;width:14px;height:14px;background:var(--carte2);border-left:2px solid var(--c,var(--corail));border-top:2px solid var(--c,var(--corail));transform:rotate(45deg)}
.bulle .sorte{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bulle .etiq{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 10px;border-radius:999px;background:var(--c,var(--corail));color:#1e2b38}
.bulle .mot{font-family:var(--lecture);font-weight:600}
.bulle p{grid-column:1/-1;margin:0}
.bulle .capsule-btn{grid-column:1/-1;justify-self:start;border:0;background:transparent;color:var(--or);font-weight:700;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
.bulle.bravo{--c:var(--sauge)}
.famille-forme{--c:var(--bleu)}      /* majuscule, ponctuation */
.famille-accord{--c:var(--corail)}   /* pluriel, verbe, adjectif */
.famille-homo{--c:var(--lavande)}    /* a/à, et/est… */
.famille-ortho{--c:var(--or)}        /* orthographe, accent */
.famille-sens{--c:var(--sauge)}      /* compréhension */
/* Corriger le texte */
.page.corriger .lecture .mot-c{cursor:pointer;border-bottom:2px dotted transparent;padding:0 1px}
.page.corriger .lecture .mot-c:hover{border-bottom-color:var(--doux)}
.mot-c.trouve{background:#d9f5df;color:#1f6334;border-radius:4px}
.mot-c.ouvert{background:#fff1b8;color:#1e2b38;border-radius:4px}
.compteur{font-family:var(--titre);font-size:20px}
.editeur{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;border-radius:14px;background:var(--carte);border:2px solid var(--or)}
.editeur input{flex:1 1 200px;min-width:0;min-height:48px;padding:8px 12px;border-radius:10px;border:2px solid var(--ligne);background:var(--page);color:var(--encre);font-family:var(--lecture);font-size:20px}
/* Capsules */
.capsules{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border-radius:999px;border:2px solid var(--c,var(--ligne));background:var(--carte2);color:var(--texte);font-size:15px;font-weight:700}
dialog{border:0;border-radius:18px;padding:0;max-width:min(560px,calc(100% - 32px));background:var(--carte);color:var(--texte);box-shadow:0 20px 50px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,16,24,.6)}
.cap{padding:22px 24px;display:flex;flex-direction:column;gap:12px;border-top:8px solid var(--c,var(--or));border-radius:18px}
.cap h3{font-size:24px}
.cap p{margin:0}
.cap .ex{background:var(--page);color:var(--encre);border-radius:12px;padding:12px 16px;font-family:var(--lecture);font-size:19px;line-height:1.7}
.cap .ex b{color:var(--sauge)}
.cap .ex s{color:var(--corail)}
/* Écrire */
.compte-mots{font-variant-numeric:tabular-nums;color:var(--doux)}
.compte-mots.ok{color:var(--sauge)}
.apercu{font-family:var(--lecture);font-size:20px;line-height:1.9}
.apercu mark{background:transparent;border-bottom:3px solid var(--c);color:inherit;cursor:pointer;padding:0 1px;border-radius:3px}
.apercu mark.actif{background:#fff1b8;color:#1e2b38}
.note{font-size:14px;color:var(--doux);margin:0}
@media (max-width:640px){
  h1{font-size:28px}
  .themes{grid-template-columns:repeat(3,minmax(0,1fr))}
  .textes{grid-template-columns:1fr}
  .texte-btn{min-height:50px}
  .etapes{grid-template-columns:repeat(2,1fr)}
  .page{padding:18px 18px}
  .lecture{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.retour-site{color:var(--doux);font-weight:700;text-decoration:none}
.retour-site:hover{color:var(--texte)}

[hidden]{display:none!important}
/* Leçon */
.tete-lecon{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.chip-c{padding:4px 12px;border-radius:999px;background:var(--carte);border:2px solid var(--ligne);font-weight:700;font-size:15px}
.onglets.deux{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:6px;border-radius:16px;background:var(--carte);border:2px solid var(--ligne)}
.ongl-c{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border:0;border-radius:12px;background:transparent;color:var(--doux);font-weight:700;font-size:17px}
.ongl-c[aria-selected="true"]{background:var(--sauge-f);color:#fff}
.regle{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:var(--carte);border-left:6px solid var(--or);font-family:var(--lecture);font-size:20px;line-height:1.7}
.regle b{color:var(--or)}
.regle s{color:var(--corail)}
.regle .lire{margin-left:auto}
.exemples{display:flex;flex-direction:column;gap:8px}
.exemple{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;padding:10px 14px;border-radius:12px;background:var(--carte2);border:1px solid var(--ligne)}
.exemple .fr{font-family:var(--lecture);font-size:20px;font-weight:500}
.exemple .ex{color:var(--doux);font-size:16px}
/* Exercices */
.exo{background:var(--carte);border:2px solid var(--ligne);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.pastilles{display:flex;gap:6px;flex-wrap:wrap}
.pastilles i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ligne)}
.pastilles i.ok{background:var(--sauge);border-color:var(--sauge)}
.pastilles i.non{background:var(--corail);border-color:var(--corail)}
.pastilles i.ici{border-color:var(--or);background:var(--or)}
.q-c{font-family:var(--lecture);font-size:24px;font-weight:500;line-height:1.5;display:flex;gap:12px;align-items:flex-start}
.q-c .lire{margin-left:auto}
.choix{display:flex;flex-direction:column;gap:10px}
.choix button{min-height:56px;padding:10px 16px;border-radius:14px;border:2px solid var(--ligne);background:var(--carte2);color:var(--texte);font-family:var(--lecture);font-size:21px;text-align:left}
.choix button:hover:not([disabled]){border-color:var(--bleu)}
.choix button.juste{border-color:var(--sauge);background:var(--sauge-p)}
.choix button.faux{border-color:var(--corail);opacity:.75;text-decoration:line-through}
.ecrire{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ecrire input{flex:1 1 220px;min-width:0;min-height:56px;padding:8px 14px;border-radius:12px;border:2px solid var(--ligne);background:var(--fond);color:var(--texte);font-family:var(--lecture);font-size:22px}
.bul-c{position:relative;padding:12px 16px;border-radius:14px;background:var(--carte2);border:2px solid var(--c,var(--corail));font-size:18px}
.bul-c::before{content:"";position:absolute;top:-9px;left:26px;width:14px;height:14px;background:var(--carte2);border-left:2px solid var(--c,var(--corail));border-top:2px solid var(--c,var(--corail));transform:rotate(45deg)}
.bul-c .etiq{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 10px;border-radius:999px;background:var(--c,var(--corail));color:#1e2b38;margin-right:8px;margin-bottom:4px}
.bul-c.ok{--c:var(--sauge)} .bul-c.info{--c:var(--bleu)}
.fin-x{align-items:center;text-align:center}
.fin-x .etoiles-g{font-size:56px;letter-spacing:6px;color:var(--or)}
.bas{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding-top:18px;margin-top:6px;border-top:2px dashed var(--ligne)}

/* Trois menus l'un sous l'autre */
.menu-textes{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.menu-textes .mt{width:min(460px,100%)}
.menu-textes .mt-btn{width:100%;justify-content:space-between;text-align:left}
.menu-textes .mt:hover,.menu-textes .mt.ouvert,.menu-textes .mt:focus-within{z-index:30}
@media (min-width:1100px){.menu-textes .mt-cat{top:0;left:calc(100% + 6px)} .menu-textes .mt-cat::before{left:-10px;top:0;bottom:0;width:10px;height:auto;right:auto}}
@media (max-width:1099px){.menu-textes .mt-cat{position:static;margin-top:6px} .menu-textes .mt-sous{position:static;box-shadow:none;border:0;padding:0 0 4px 22px;min-width:0;max-height:none} .menu-textes .mt-li:hover>.mt-sous{display:none} .menu-textes .mt-li.ouvert>.mt-sous{display:block} .menu-textes .mt:hover .mt-cat{display:none} .menu-textes .mt.ouvert .mt-cat{display:block}}
.mt{z-index:20}
.mt-dom{padding:8px 12px 2px;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--doux);list-style:none}
.mt-cat-btn small{display:block;font-weight:400;color:var(--doux);font-size:14px}
.mt-lec{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:8px 12px;border:0;border-radius:10px;background:transparent;color:var(--texte);font-weight:700;font-size:17px;text-align:left}
.mt-lec:hover,.mt-lec:focus-visible{background:var(--carte2)}
.mt-lec .niv{flex:none;color:var(--or);font-size:15px;min-width:44px}
.mt-lec .tx b{display:block;line-height:1.2}
.mt-lec .tx small{color:var(--doux);font-weight:400;font-size:14px}
.mt-lec .etoiles{margin-left:auto;color:var(--or);font-size:14px;white-space:nowrap}
.mt-sous{max-height:75vh;overflow:auto;min-width:340px}
.intro-menus{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
/* Rédaction */
.redac-col{grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr)}
.plan-r{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-family:var(--lecture)}
.mots-r{display:flex;flex-wrap:wrap;gap:6px}
.mot-r{padding:5px 12px;border-radius:999px;border:2px solid var(--ligne);background:var(--carte2);color:var(--texte);font-family:var(--lecture);font-size:16px}
.mot-r:hover{border-color:var(--or)}
.texte-r{min-height:340px}
.liste-r{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.liste-r li{display:flex;gap:10px;align-items:baseline;color:var(--doux)}
.liste-r li span{color:var(--corail);font-weight:800}
.liste-r li.ok{color:var(--texte)} .liste-r li.ok span{color:var(--sauge)}
@media (max-width:860px){.redac-col{grid-template-columns:1fr}}

.voix-zone{font-size:16px;color:var(--doux)}
.voix-zone select{min-height:44px;max-width:min(360px,100%);padding:6px 10px;border-radius:10px;border:2px solid var(--ligne);background:var(--carte);color:var(--texte);font:inherit;font-size:15px}
/* Menu « Textes » : catégories puis textes, au survol (ou au toucher) */
.menu-textes{position:relative;z-index:20}
.mt{position:relative;display:inline-block}
.mt-btn{display:inline-flex;align-items:center;gap:10px;min-height:56px;padding:8px 22px;border-radius:14px;border:2px solid var(--sauge);background:var(--sauge-f);color:#fff;font-family:var(--titre);font-weight:800;font-size:24px;box-shadow:0 3px 0 #23463a}
.mt-cat,.mt-sous{list-style:none;margin:0;padding:6px;background:var(--carte);border:2px solid var(--ligne);border-radius:14px;box-shadow:0 12px 28px rgba(0,0,0,.45);display:none;min-width:250px}
.mt-cat{position:absolute;top:calc(100% + 6px);left:0}
.mt:hover .mt-cat,.mt:focus-within .mt-cat,.mt.ouvert .mt-cat{display:block}
.mt-cat::before{content:"";position:absolute;left:0;right:0;top:-10px;height:10px}
.mt-li{position:relative}
.mt-cat-btn,.mt-texte{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:8px 12px;border:0;border-radius:10px;background:transparent;color:var(--texte);font-weight:700;font-size:18px;text-align:left}
.mt-cat-btn .ico{font-size:24px}
.mt-cat-btn .fl{margin-left:auto;color:var(--doux)}
.mt-cat-btn:hover,.mt-li:focus-within>.mt-cat-btn,.mt-li.ouvert>.mt-cat-btn,.mt-texte:hover,.mt-texte:focus-visible{background:var(--carte2)}
.mt-sous{position:absolute;left:calc(100% + 4px);top:-8px;min-width:300px}
.mt-li:hover>.mt-sous,.mt-li:focus-within>.mt-sous,.mt-li.ouvert>.mt-sous{display:block}
.mt-texte .niv{flex:none;color:var(--or);font-size:15px;min-width:44px}
.mt-texte b{display:block;line-height:1.2}
.mt-texte small{color:var(--doux);font-weight:400;font-size:14px}
.accueil-textes{display:flex;flex-direction:column;gap:12px;padding:24px;border-radius:18px;border:2px dashed var(--ligne);margin-top:4px}
.grand{font-size:22px}
/* Texte choisi : titre et onglets Lire, Écouter, Comprendre, Corriger */
.etapes-zone{display:flex;flex-direction:column;gap:12px}
.titre-texte{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.titre-texte h2{font-size:32px}
.chip-theme{padding:4px 12px;border-radius:999px;background:var(--carte);border:2px solid var(--ligne);font-weight:700;font-size:15px}
.niv-txt{color:var(--or);font-weight:700}
.onglets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:6px;border-radius:16px;background:var(--carte);border:2px solid var(--ligne)}
.bas-texte{display:flex;justify-content:center;padding-top:18px;margin-top:18px;border-top:2px dashed var(--ligne)}
#pageTexte,#pagePhrase{user-select:none;-webkit-user-select:none}
.phrase-c{font-size:28px;line-height:2.1}
.mot-c.non{background:#f3c1b5;color:#1e2b38;border-radius:4px;animation:secoue .35s}
@keyframes secoue{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pastilles-c{display:flex;gap:6px}
.pastilles-c i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ligne)}
.pastilles-c i.ok{background:var(--sauge);border-color:var(--sauge)}
.pastilles-c i.ici{background:var(--or);border-color:var(--or)}
.fin-c{align-items:center;text-align:center;padding:30px 10px}
.grand-ico{font-size:80px;line-height:1}
@media (max-width:700px){
  .mt-sous{position:static;box-shadow:none;border:0;padding:0 0 4px 30px;min-width:0}
  .mt-li:hover>.mt-sous{display:none}
  .mt-li.ouvert>.mt-sous{display:block}
  .mt-cat{min-width:min(320px,calc(100vw - 32px))}
  .onglets{grid-template-columns:repeat(2,1fr)}
  .titre-texte h2{font-size:26px}
  .phrase-c{font-size:23px}
}
@media (prefers-reduced-motion:reduce){.mot-c.non{animation:none}}

/* ---------- Exercices : un à la fois, deux essais ---------- */
let S = null;
const norm = s => s.replace(/[’`]/g, "'").replace(/\s+/g, " ").replace(/\s*…\s*|\s*\.\.\.\s*/g, " ").trim();
function compare(rep, attendues) {
  const r = norm(rep);
  for (const a of attendues) {
    const A = norm(a), garderCasse = /[A-ZÀ-Ý]/.test(A) || /[.!?]$/.test(A) && A.length > 2;
    const x = garderCasse ? r : r.toLowerCase().replace(/[.!]$/, ""), y = garderCasse ? A : A.toLowerCase().replace(/[.!]$/, "");
    if (x === y) return "juste";
  }
  for (const a of attendues) { if (norm(rep).toLowerCase().replace(/[.!?]$/, "") === norm(a).toLowerCase().replace(/[.!?]$/, "")) return "forme"; }
  for (const a of attendues) { if (sansAccent(norm(rep)).toLowerCase().replace(/[.!?]$/, "") === sansAccent(norm(a)).toLowerCase().replace(/[.!?]$/, "")) return "accent"; }
  return "faux";
}
function exercices() {
  S = { i: 0, essais: 0, res: [] };
  unExo();
}
function unExo() {
  const q = L.exos[S.i];
  $("#contenu").innerHTML = `<section class="accueil">${entete()}
    <div class="barre"><span class="pastilles">${L.exos.map((_, k) => `<i class="${k < S.i ? (S.res[k] ? "ok" : "non") : k === S.i ? "ici" : ""}"></i>`).join("")}</span><span class="doux" style="font-size:15px">Question ${S.i + 1} sur ${L.exos.length}</span></div>
    <div class="exo"><p class="q-c"><span>${esc(q.q)}</span><button type="button" class="lire" id="lireQ" aria-label="Écouter la question">🔊</button></p>
      ${q.t === "choix" ? `<div class="choix">${q.o.map((o, k) => `<button type="button" data-o="${k}">${esc(o)}</button>`).join("")}</div>`
        : `<div class="ecrire"><input id="rep" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Ta réponse" placeholder="Écris ta réponse"><button type="button" class="btn vert" id="verif">Vérifier</button></div>`}
      <div id="bulle" aria-live="polite"></div>
      <div id="nav" hidden><button type="button" class="btn vert" id="suiv">${S.i + 1 < L.exos.length ? "Question suivante →" : "Voir mon résultat"}</button></div>
    </div>${bas()}</section>`;
  brancherBas();
  $("#lireQ").onclick = () => parler(lisible(q.q + (q.t === "choix" ? ". " + q.o.join(". ") : "")));
  S.essais = 0;
  const fini = (juste) => { S.res[S.i] = juste && S.essais === 1; $("#nav").hidden = false; $("#suiv").focus(); };
  if (q.t === "choix") {
    document.querySelectorAll("[data-o]").forEach(b => b.onclick = () => {
      S.essais++; const k = +b.dataset.o;
      if (k === q.r) { son("juste"); b.classList.add("juste"); document.querySelectorAll("[data-o]").forEach(x => x.disabled = true); $("#bulle").innerHTML = `<div class="bul-c ok"><span class="etiq">${S.essais === 1 ? "Bravo" : "Oui, c'est ça"}</span>${esc(q.pourquoi)}</div>`; fini(true); }
      else { son("faux"); b.classList.add("faux"); b.disabled = true;
        if (S.essais >= 2) { document.querySelectorAll("[data-o]").forEach(x => { x.disabled = true; if (+x.dataset.o === q.r) x.classList.add("juste"); }); $("#bulle").innerHTML = `<div class="bul-c"><span class="etiq">La bonne réponse</span>« ${esc(q.o[q.r])} » — ${esc(q.pourquoi)}</div>`; fini(false); }
        else $("#bulle").innerHTML = `<div class="bul-c"><span class="etiq">Pas tout à fait</span>Relis la question et essaie encore une fois.</div>`; }
    });
  } else {
    const inp = $("#rep"); inp.focus();
    const verif = () => {
      if (!inp.value.trim()) { $("#bulle").innerHTML = `<div class="bul-c info"><span class="etiq">Pas de réponse</span>Écris ta réponse dans l'espace.</div>`; return; }
      S.essais++; const c = compare(inp.value, q.r);
      if (c === "juste") { son("juste"); inp.disabled = true; $("#verif").disabled = true; $("#bulle").innerHTML = `<div class="bul-c ok"><span class="etiq">${S.essais === 1 ? "Bravo" : "Oui, c'est ça"}</span>${esc(q.pourquoi)}</div>`; fini(true); return; }
      son("faux");
      if (S.essais >= 2) { inp.disabled = true; $("#verif").disabled = true; $("#bulle").innerHTML = `<div class="bul-c"><span class="etiq">La bonne réponse</span>« ${esc(q.r[0])} » — ${esc(q.pourquoi)}</div>`; fini(false); return; }
      const msg = c === "accent" ? ["Attention aux accents", "Les lettres sont bonnes, mais il manque un accent ou il y en a un de trop."] : c === "forme" ? ["Presque !", "Vérifie la majuscule et la ponctuation."] : ["Pas tout à fait", "Relis la leçon et essaie encore une fois."];
      $("#bulle").innerHTML = `<div class="bul-c"><span class="etiq">${msg[0]}</span>${msg[1]}${q.aide ? ` Indice : <b>${esc(q.aide)}</b>.` : ""}</div>`; inp.select();
    };
    $("#verif").onclick = verif; inp.onkeydown = e => { if (e.key === "Enter" && !inp.disabled) verif(); };
  }
  $("#suiv").onclick = () => { taire(); S.i++; if (S.i < L.exos.length) unExo(); else finExos(); };
}
function finExos() {
  const n = S.res.filter(Boolean).length, pc = Math.round(100 * n / L.exos.length), av = resultat(L.id);
  if (!av || pc >= av.pc) memo.ecrire("cours-" + L.id, { pc, date: Date.now() });
  const e = etoilesDe({ pc });
  $("#contenu").innerHTML = `<section class="accueil">${entete()}<div class="exo fin-x"><div class="etoiles-g" aria-label="${e} étoiles sur 3">${txtEtoiles(e)}</div>
    <h3>${pc >= 90 ? "Excellent travail !" : pc >= 70 ? "Très bien !" : pc >= 50 ? "C'est un bon début !" : "Continue, tu vas y arriver !"}</h3>
    <p>${n} bonnes réponses du premier coup sur ${L.exos.length}.</p>
    <div class="barre" style="justify-content:center">${pc < 70 ? `<button type="button" class="btn" id="relire">📘 Relire la leçon</button>` : ""}<button type="button" class="btn vert" id="refaire">↻ Refaire les exercices</button></div></div>${bas()}</section>`;
  brancherBas();
  if ($("#relire")) $("#relire").onclick = () => { vue = "lecon"; afficher(); };
  $("#refaire").onclick = () => exercices();
}

function verifierRedac(t, silencieux) {
  const { N, s } = R_, v = verifier(t), r = $("#resultat");
  if (!t.trim()) { r.innerHTML = bulle("vide", "Écris ton texte dans l'espace."); brancherCapsules(r); return; }
  const ortho = orthographe(t, v.erreurs.map(e => e.mot), s.sujet + " " + s.mots.join(" ") + " " + s.plan.join(" "));
  // les fautes d'orthographe trouvées sont placées dans le texte
  ortho.forEach(o => { const re = new RegExp("(^|[^A-Za-zÀ-ÿ'’])(" + o.mot.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")(?![A-Za-zÀ-ÿ])"); const m = re.exec(t); if (m) { const d = m.index + m[1].length; if (!v.erreurs.some(e => e.d === d)) v.erreurs.push({ d, f: d + o.mot.length, mot: o.mot, t: o.t, conseil: o.conseil, sugg: o.sugg }); } });
  v.erreurs.sort((a, b) => a.d - b.d);
  const nbPhrases = (t.match(/[^.!?]+[.!?]+/g) || []).length, bas = sansAccent(t.toLowerCase().replace(/’/g, "'"));
  const liens = CONNECTEURS.filter(c => new RegExp("(^|[^a-z])" + sansAccent(c).replace(/'/g, "'") + "([^a-z]|$)").test(bas));
  const paras = t.split(/\n\s*\n/).filter(x => x.trim()).length;
  const forme = v.erreurs.filter(e => ["majuscule", "ponctuation"].includes(e.t)).length, autres = v.erreurs.length - forme;
  const liste = [
    [v.nbMots >= N.min, `Au moins ${N.min} mots (tu en as ${v.nbMots})`],
    [nbPhrases >= N.phrases, `Au moins ${N.phrases} phrases (tu en as ${nbPhrases})`],
    [forme === 0, "Une majuscule au début et un point à la fin de chaque phrase"],
    ...(N.liens ? [[liens.length >= N.liens, `Au moins ${N.liens} mots de liaison différents${liens.length ? " (" + liens.join(", ") + ")" : ""}`]] : []),
    ...(N.paragraphes > 1 ? [[paras >= N.paragraphes, `${N.paragraphes} paragraphes séparés par une ligne vide (tu en as ${paras})`]] : []),
    [autres === 0, "Pas d'erreur d'accord, d'homophone ou d'orthographe trouvée"]
  ];
  const tout = liste.every(x => x[0]);
  let html = "", pos = 0;
  v.erreurs.forEach((e, k) => { html += esc(t.slice(pos, e.d)) + `<mark class="${famille(e.t)}" data-e="${k}" tabindex="0">${esc(t.slice(e.d, e.f))}</mark>`; pos = e.f; }); html += esc(t.slice(pos));
  r.innerHTML = `<div class="question"><h3>✅ Ma liste de vérification</h3><ul class="liste-r">${liste.map(([ok, txt]) => `<li class="${ok ? "ok" : ""}"><span aria-hidden="true">${ok ? "✔" : "○"}</span>${esc(txt)}</li>`).join("")}</ul></div>`
    + (v.erreurs.length ? `<h2>${v.erreurs.length} erreur${v.erreurs.length > 1 ? "s" : ""} à corriger</h2><article class="page"><p class="apercu">${html.replace(/\n/g, "<br>")}</p></article><p class="consigne">Touche un mot souligné pour voir sa bulle. Corrige ton texte plus haut, puis vérifie encore.</p>` : "")
    + `<div class="bulles" id="bullesT">${v.erreurs.map(e => bulle(e.t, e.conseil, e.mot, e.sugg)).join("")}</div>`
    + (tout ? bravo("Bravo, ton texte respecte toute la liste !", "Relis-le une dernière fois, puis montre-le à ton enseignante.") : "");
  if (tout) { const f = memo.lire("redac-faits", []); if (!f.includes(s.id)) { f.push(s.id); memo.ecrire("redac-faits", f); } if (!silencieux) son("juste"); }
  r.querySelectorAll("mark[data-e]").forEach(mk => { mk.onclick = mk.onkeydown = ev => { if (ev.type === "keydown" && ev.key !== "Enter") return; r.querySelectorAll("mark.actif").forEach(x => x.classList.remove("actif")); mk.classList.add("actif"); const b = r.querySelectorAll("#bullesT .bulle")[+mk.dataset.e]; if (b) { b.scrollIntoView({ block: "nearest", behavior: "smooth" }); } }; });

}

      <ul class="mt-sous" role="menu">${c.items.map(it => it.entete ? `<li class="mt-dom" role="presentation">${it.entete}</li>` : `<li role="none"><button type="button" role="menuitem" class="mt-lec" ${it.attr}>${it.html}</button></li>`).join("")}</ul></li>`).join("")}</ul></div>`).join("");

  document.querySelectorAll("[data-redac]").forEach(b => b.onclick = () => ouvrirRedac(b.dataset.redac));
  setTimeout(() => { if (window._fermeMenu) document.removeEventListener("click", window._fermeMenu); window._fermeMenu = e => { if (!e.target.closest || !e.target.closest(".mt")) fermer(null); }; document.addEventListener("click", window._fermeMenu); }, 0);

function montrerMenus(oui) { $("#menuTextes").hidden = !oui; $("#etapes").hidden = oui || mode !== "texte"; if (oui) dessinerMenu(); }

function ouvrirTexte(tid, k) {

function dessinerEtapes() {

    <div class="onglets" role="tablist">${ETAPES.map(([i, n], k) => `<button type="button" role="tab" class="etape${p.faites.includes(k) ? " fait" : ""}" data-etape="${k}" aria-selected="${k === etape}" ${k === etape ? 'aria-current="step"' : ""}><span class="num">${p.faites.includes(k) ? "✓" : i}</span>${n}</button>`).join("")}</div>`;

/* Une bulle d'erreur : la sorte d'erreur, le conseil, et la capsule de grammaire */
function bulle(t, conseil, mot, sugg) {
  const S = SORTES[t] || SORTES.orthographe;
  return `<div class="bulle ${famille(t)}" role="note"><div class="sorte"><span class="etiq">${S.nom}</span>${mot ? `<span class="mot">« ${esc(mot)} »</span>` : ""}${sugg ? `<span>→ <span class="mot">${esc(sugg)}</span></span>` : ""}</div><p>${esc(conseil || S.txt)}</p>${S.cap ? `<button type="button" class="capsule-btn" data-capsule="${t}">📘 Capsule : ${S.cap}</button>` : ""}</div>`;
}
const bravo = (titre, texte) => `<div class="bulle bravo" role="status"><div class="sorte"><span class="etiq">Bravo</span></div><p><b>${esc(titre)}</b>${texte ? " " + esc(texte) : ""}</p></div>`;
function brancherCapsules(racine) { (racine || document).querySelectorAll("[data-capsule]").forEach(b => b.onclick = () => ouvrirCapsule(b.dataset.capsule)); }
function ouvrirCapsule(t) {
  const S = SORTES[t]; if (!S) return;
  $("#capContenu").className = "cap " + famille(t);
  $("#capContenu").innerHTML = `<h3>📘 ${S.cap}</h3><p>${S.txt}</p>${S.ex ? `<div class="ex">${S.ex}</div>` : ""}<div class="barre"><button type="button" class="btn petit" id="capLire">🔊 Écouter</button><button type="button" class="btn vert petit" id="capFermer">J'ai compris</button></div>`;
  const d = $("#capsule"); if (d.showModal) d.showModal(); else d.setAttribute("open", "");
  $("#capFermer").onclick = () => { taire(); d.close ? d.close() : d.removeAttribute("open"); };
  $("#capLire").onclick = () => parler(S.cap + ". " + S.txt + " " + S.ex.replace(/<br>/g, ". ").replace(/<[^>]+>/g, ""));
}
/* Le texte ne peut pas être copié (pour que l'élève réponde avec ses mots) */
function protegerTexte(el) { ["copy", "cut", "contextmenu", "dragstart", "selectstart"].forEach(ev => el.addEventListener(ev, e => e.preventDefault())); }
function motsCliquables(texte) {
  const mots = []; let html = ""; const re = /[A-Za-zÀ-ÖØ-öø-ÿ0-9'’-]+|[^A-Za-zÀ-ÖØ-öø-ÿ0-9'’-]+/g; let m;
  while ((m = re.exec(texte))) { if (/[A-Za-zÀ-ÿ0-9]/.test(m[0])) { mots.push(m.index); html += `<span class="m" data-i="${m.index}">${esc(m[0])}</span>`; } else html += esc(m[0]); }
  return { mots, html };
}

/* ---------- 1. Lire ---------- */
function lire() {
  $("#contenu").innerHTML = `<section class="panneau">
    <article class="page" id="pageTexte"><p class="lecture">${esc(theme.texte)}</p></article>

    <div class="barre"><button type="button" class="btn vert" id="suivant">J'ai lu le texte → Écouter</button></div></section>`;
  protegerTexte($("#pageTexte"));
  $("#suivant").onclick = () => { marquer(0); etape = 1; tout(); };
}
/* ---------- 2. Écouter ---------- */
function ecouter() {
  const { mots, html } = motsCliquables(theme.texte);
  $("#contenu").innerHTML = `<section class="panneau">
    <div class="barre"><button type="button" class="btn vert" id="ecouterBtn">🔊 Écouter le texte</button><button type="button" class="btn" id="arreter">⏹ Arrêter</button>
      <button type="button" class="btn" id="pauseL">⏸ Pause</button>
      <span class="vitesse" role="group" aria-label="Vitesse de lecture">${VITESSES.map(([v, n]) => `<button type="button" data-v="${v}" aria-pressed="${vitesse === v}">${n}</button>`).join("")}</span></div>
    ${voixListe.length > 1 ? `<div class="barre voix-zone"><label for="choixVoix">Voix :</label><select id="choixVoix">${voixListe.map(v => `<option value="${esc(v.name)}" ${meilleureVoix() === v ? "selected" : ""}>${esc(v.name)} (${v.lang})</option>`).join("")}</select><button type="button" class="btn petit" id="essaiVoix">🔊 Essayer</button></div>` : ""}
    <article class="page" id="pageTexte"><p class="lecture" id="lecture">${html}</p></article>
    <p class="consigne">Écoute le texte et suis avec tes yeux : les mots s'allument pendant la lecture.</p>
    <div class="barre"><button type="button" class="btn vert" id="suivant">J'ai écouté → Comprendre</button></div></section>`;
  protegerTexte($("#pageTexte"));
  const allumer = ci => { document.querySelectorAll("#lecture .m.lu").forEach(x => x.classList.remove("lu")); let k = mots.length - 1; while (k > 0 && mots[k] > ci) k--; const e = document.querySelector(`#lecture .m[data-i="${mots[k]}"]`); if (e) e.classList.add("lu"); };
  $("#ecouterBtn").onclick = () => { if (!parler(theme.titre + ". " + theme.texte, ci => allumer(ci - theme.titre.length - 2), () => document.querySelectorAll("#lecture .m.lu").forEach(x => x.classList.remove("lu")))) $("#ecouterBtn").textContent = "Lecture à voix haute non disponible sur cet appareil"; };
  $("#arreter").onclick = () => { taire(); $("#pauseL").textContent = "⏸ Pause"; document.querySelectorAll("#lecture .m.lu").forEach(x => x.classList.remove("lu")); };
  $("#pauseL").onclick = () => { try { if (speechSynthesis.paused) { speechSynthesis.resume(); $("#pauseL").textContent = "⏸ Pause"; } else if (speechSynthesis.speaking) { speechSynthesis.pause(); $("#pauseL").textContent = "▶ Continuer"; } } catch (e) {} };
  document.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { vitesse = +b.dataset.v; memo.ecrire("lee-vitesse2", vitesse); document.querySelectorAll("[data-v]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); });
  if ($("#choixVoix")) { $("#choixVoix").onchange = e => memo.ecrire("lee-voix", e.target.value); $("#essaiVoix").onclick = () => parler("Bonjour ! Je vais te lire le texte. Écoute bien."); }

/* ---------- 3. Comprendre : questions, sans copier-coller, avec correcteur ---------- */
function comprendre() {
  const p = prog(), P = phrases(theme.texte);
  $("#contenu").innerHTML = `<section class="panneau">
    <p class="consigne">Réponds à chaque question par une phrase, <b>avec tes mots</b>. On ne peut pas copier le texte ni coller une réponse.</p>
    <div class="deux-col"><article class="page texte-fixe" id="pageTexte"><h3>${theme.titre}</h3><p class="lecture" id="relire">${P.map((s, k) => `<span data-ph="${k}">${esc(s)}</span>`).join(" ")}</p></article><div class="col-q">
    ${theme.questions.map((q, i) => `<div class="question" id="q${i}"><div class="q-tete"><p>${i + 1}. ${esc(q.q)}</p><button type="button" class="lire" data-lire-q="${i}" aria-label="Écouter la question">🔊</button></div>
      <label for="rep${i}" hidden>Ta réponse</label><textarea id="rep${i}" placeholder="Écris ta réponse ici…" autocomplete="off">${esc(p.reponses[i] || "")}</textarea>
      <div class="barre"><button type="button" class="btn vert petit" data-verif-q="${i}">Vérifier ma réponse</button></div><div class="bulles" id="b${i}"></div></div>`).join("")}
    </div></div>
    <div class="barre"><button type="button" class="btn vert" id="suivant">Continuer → Corriger</button></div></section>`;
  protegerTexte($("#pageTexte"));
  theme.questions.forEach((q, i) => {
    const ta = $("#rep" + i);
    ta.oninput = e => { const p = prog(); p.reponses[i] = e.target.value; sauver(p); };
    ["paste", "drop"].forEach(ev => ta.addEventListener(ev, e => { e.preventDefault(); $("#b" + i).innerHTML = `<div class="bulle famille-sens"><div class="sorte"><span class="etiq">Pas de copier-coller</span></div><p>Écris ta réponse toi-même, avec tes mots.</p></div>`; }));
  });
  document.querySelectorAll("[data-lire-q]").forEach(b => b.onclick = () => parler(theme.questions[+b.dataset.lireQ].q));
  document.querySelectorAll("[data-verif-q]").forEach(b => b.onclick = () => verifierReponse(+b.dataset.verifQ));
  $("#suivant").onclick = () => { taire(); marquer(2); etape = 3; tout(); };
}
function verifierReponse(i) {
  const P2 = phrases(theme.texte), q = theme.questions[i], rep = $("#rep" + i).value, zone = $("#b" + i), carte = $("#q" + i);
  document.querySelectorAll("#relire .indice").forEach(x => x.classList.remove("indice"));
  if (!rep.trim()) { zone.innerHTML = bulle("vide"); brancherCapsules(zone); return; }
  const norm = " " + sansAccent(rep) + " ", trouves = q.cles[0].filter(k => norm.includes(sansAccent(k)));
  const out = [];
  if (trouves.length < (q.min || 1)) out.push(bulle("reponse", (q.min ? "Nomme au moins " + q.min + " choses. " : "") + "Ta réponse ne dit pas encore la bonne information. Relis la phrase du texte qui est surlignée en jaune."));
  const v = verifier(rep);
  if (v.nbMots < 3) out.push(bulle("phrase", "Écris une phrase complète. Par exemple, commence avec des mots de la question."));
  v.erreurs.forEach(e => out.push(bulle(e.t, e.conseil, e.mot, e.sugg)));
  orthographe(rep, v.erreurs.map(e => e.mot), theme.texte + " " + q.q + " " + q.modele).forEach(e => out.push(bulle(e.t, e.conseil, e.mot, e.sugg)));
  if (!out.length) { carte.classList.add("juste"); zone.innerHTML = bravo("Bonne réponse, bien écrite !", "Exemple : " + q.modele); }
  else { carte.classList.remove("juste"); zone.innerHTML = out.join("");
    if (trouves.length < (q.min || 1)) { const k = P2.findIndex(x => sansAccent(x).includes(sansAccent(q.ind || q.cles[0][0]))), ph = document.querySelector(`#relire [data-ph="${k}"]`); if (ph) { ph.classList.add("indice"); ph.scrollIntoView({ block: "nearest", behavior: "smooth" }); } } }
  brancherCapsules(zone);
}

/* ---------- 4. Corriger : une phrase à la fois ----------
   1) l'élève touche le mot qui contient l'erreur (sinon : un son et « ce n'est pas le bon mot ») ;
   2) il écrit le mot correctement dans l'espace qui apparaît. */
function phrasesAErreur() {
  const seq = [];
  theme.corriger.forEach((seg, s) => { if (typeof seg === "object") seq.push({ err: seg, s }); else seg.split(/(?<=[.!?])\s+/).forEach((morceau, j, arr) => { seq.push({ txt: morceau + (j < arr.length - 1 ? " " : ""), fin: j < arr.length - 1 }); }); });
  const res = []; let cur = [];
  seq.forEach(it => { cur.push(it); if (it.fin) { res.push(cur); cur = []; } });
  if (cur.length) res.push(cur);
  const out = [];
  res.forEach(ph => ph.filter(x => x.err).forEach(cible => out.push(ph.map(x => x.err && x !== cible ? { txt: x.err.c } : x))));
  return out;
}

function corriger() {
  const P = phrasesAErreur(), p = prog(), faites = p.corrige || {};
  if (phraseNo >= P.length) phraseNo = 0;
  const premiere = P.findIndex(ph => ph.some(x => x.err && !faites[x.s])); if (premiere < 0 && phraseNo === 0) return finCorriger(P);
  if (P[phraseNo].every(x => !x.err || faites[x.s]) && premiere >= 0) phraseNo = premiere;
  const ph = P[phraseNo];
  let html = "", k = 0; const re = /[A-Za-zÀ-ÖØ-öø-ÿ0-9'’-]+|[^A-Za-zÀ-ÖØ-öø-ÿ0-9'’-]+/g;
  ph.forEach(it => {
    if (it.err) { html += `<span class="mot-c${faites[it.s] ? " trouve" : ""}" role="button" tabindex="0" data-s="${it.s}">${esc(faites[it.s] ? it.err.c : it.err.f)}</span>`; return; }
    let m; re.lastIndex = 0; while ((m = re.exec(it.txt))) { if (/[A-Za-zÀ-ÿ0-9]/.test(m[0])) html += `<span class="mot-c" role="button" tabindex="0" data-k="${k++}">${esc(m[0])}</span>`; else html += esc(m[0]); }
  });
  const nbFaites = P.filter(ph => ph.every(x => !x.err || faites[x.s])).length;
  $("#contenu").innerHTML = `<section class="panneau">
    <div class="barre"><span class="compteur">Phrase ${phraseNo + 1} sur ${P.length}</span><span class="pastilles-c">${P.map((ph, i) => `<i class="${ph.every(x => !x.err || faites[x.s]) ? "ok" : i === phraseNo ? "ici" : ""}"></i>`).join("")}</span><button type="button" class="btn petit" id="ecouterP">🔊 Écouter la phrase</button></div>
    <p class="consigne grand">Cette phrase contient <b>une erreur</b>. <b>Quel mot</b> contient l'erreur ? Touche-le.</p>
    <article class="page corriger" id="pagePhrase"><p class="lecture phrase-c" id="phraseC">${html}</p></article>
    <div class="editeur" id="editeur" hidden><label for="correction">Écris le mot <b id="motChoisi"></b> correctement :</label><input id="correction" autocomplete="off" spellcheck="false" autocapitalize="off"><button type="button" class="btn vert petit" id="valider">✓ Valider</button></div>
    <div class="bulles" id="bullesC" aria-live="polite"></div>
    <div class="barre" id="navPhrase" hidden><button type="button" class="btn vert" id="phraseSuiv">${nbFaites + 1 >= P.length ? "Terminer ✓" : "Phrase suivante →"}</button></div></section>`;
  protegerTexte($("#pagePhrase"));
  let choisi = null;
  document.querySelectorAll("#phraseC .mot-c").forEach(el => {
    el.onclick = () => {
      if (el.classList.contains("trouve")) return;
      document.querySelectorAll(".mot-c.ouvert,.mot-c.non").forEach(x => x.classList.remove("ouvert", "non"));
      if (el.dataset.s == null) { // pas le bon mot
        son("faux"); el.classList.add("non"); setTimeout(() => el.classList.remove("non"), 700);
        $("#bullesC").innerHTML = `<div class="bulle famille-forme"><div class="sorte"><span class="etiq">Ce n'est pas le bon mot</span><span class="mot">« ${esc(el.textContent)} »</span></div><p>Ce mot est bien écrit. Relis la phrase et cherche un autre mot.</p></div>`;
        $("#editeur").hidden = true; return;
      }
      choisi = el; el.classList.add("ouvert");
      $("#bullesC").innerHTML = bravo("Oui, c'est ce mot !", "Maintenant, écris-le correctement.");
      $("#editeur").hidden = false; $("#motChoisi").textContent = "« " + el.textContent + " »"; $("#correction").value = ""; $("#correction").focus();
    };
    el.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); el.click(); } };
  });
  $("#correction").onkeydown = e => { if (e.key === "Enter") $("#valider").click(); };
  $("#valider").onclick = () => {
    if (!choisi) return; const val = propre($("#correction").value), s = +choisi.dataset.s, seg = theme.corriger[s], zone = $("#bullesC");
    if (!val) { zone.innerHTML = bulle("vide", "Écris le mot dans l'espace."); return; }
    if (val === seg.c) {
      son("juste"); const p = prog(); p.corrige[s] = true; sauver(p);
      choisi.textContent = seg.c; choisi.classList.remove("ouvert"); choisi.classList.add("trouve"); $("#editeur").hidden = true;
      zone.innerHTML = bravo("« " + seg.f + " » → « " + seg.c + " »", "C'était une erreur de " + SORTES[seg.t].nom.toLowerCase() + ".") + `<button type="button" class="capsule-btn" data-capsule="${seg.t}">📘 Revoir la capsule : ${SORTES[seg.t].cap}</button>`;
      if (ph.every(x => !x.err || prog().corrige[x.s])) $("#navPhrase").hidden = false;
    } else if (val === seg.f) zone.innerHTML = bulle(seg.t, "Tu as écrit le même mot. Il faut le changer. Regarde la capsule pour t'aider.", seg.f, "");
    else zone.innerHTML = bulle(seg.t, "Ce n'est pas encore ça. C'est une erreur de « " + SORTES[seg.t].nom + " ». Essaie encore.", val, "");
    brancherCapsules(zone);
  };
  $("#ecouterP").onclick = () => parler(ph.map(x => x.err ? x.err.f : x.txt).join(""));
  $("#phraseSuiv").onclick = () => { const P2 = phrasesAErreur(), f2 = prog().corrige; const n = P2.findIndex(ph => ph.some(x => x.err && !f2[x.s])); if (n < 0) { marquer(3); finCorriger(P2); } else { phraseNo = n; tout(); } };
}
function finCorriger(P) {
  $("#contenu").innerHTML = `<section class="panneau fin-c"><div class="grand-ico" aria-hidden="true">🏆</div><h2>Bravo ! Tu as corrigé toutes les phrases.</h2>
    <p class="doux">Tu as trouvé et corrigé ${P.length} erreurs.</p>
    <div class="barre"><button type="button" class="btn" id="refaire">↻ Recommencer les phrases</button></div></section>`;
  $("#refaire").onclick = () => { const p = prog(); p.corrige = {}; sauver(p); phraseNo = 0; tout(); };
  $("#contenu").insertAdjacentHTML("beforeend", `<div class="bas-texte"><button type="button" class="btn vert" id="autreTexte2">📚 Choisir un autre texte</button></div>`);
  $("#autreTexte2").onclick = () => vueMenu("textes");
}
